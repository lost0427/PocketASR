name: SherpaMnnBindings
description: >-
  Narrow offline SenseVoice bindings generated from the pinned sherpa-mnn C
  API snapshot. Do not edit the generated Dart file by hand.
output: lib/engine/sherpa_mnn_bindings.dart
headers:
  entry-points:
    - native/sherpa_mnn/include/sherpa-mnn/c-api/c-api.h
  include-directives:
    - native/sherpa_mnn/include/sherpa-mnn/c-api/c-api.h
functions:
  include:
    - ^SherpaMnnCreateOfflineRecognizer$
    - ^SherpaMnnDestroyOfflineRecognizer$
    - ^SherpaMnnCreateOfflineStream$
    - ^SherpaMnnDestroyOfflineStream$
    - ^SherpaMnnAcceptWaveformOffline$
    - ^SherpaMnnDecodeOfflineStream$
    - ^SherpaMnnGetOfflineStreamResult$
    - ^SherpaMnnDestroyOfflineRecognizerResult$
structs:
  include:
    - ^SherpaMnnFeatureConfig$
    - ^SherpaMnnOfflineTransducerModelConfig$
    - ^SherpaMnnOfflineParaformerModelConfig$
    - ^SherpaMnnOfflineNemoEncDecCtcModelConfig$
    - ^SherpaMnnOfflineWhisperModelConfig$
    - ^SherpaMnnOfflineFireRedAsrModelConfig$
    - ^SherpaMnnOfflineMoonshineModelConfig$
    - ^SherpaMnnOfflineTdnnModelConfig$
    - ^SherpaMnnOfflineLMConfig$
    - ^SherpaMnnOfflineSenseVoiceModelConfig$
    - ^SherpaMnnOfflineModelConfig$
    - ^SherpaMnnOfflineRecognizerConfig$
    - ^SherpaMnnOfflineRecognizerResult$
    - ^SherpaMnnOfflineRecognizer$
    - ^SherpaMnnOfflineStream$
unions:
  exclude:
    - .*
enums:
  exclude:
    - .*
unnamed-enums:
  exclude:
    - .*
globals:
  exclude:
    - .*
macros:
  exclude:
    - .*
comments:
  style: any
  length: full
preamble: |
  // Generated by `dart run ffigen --config ffigen.sherpa_mnn.yaml`.
  // Source: MNN d407447ed56c4121a11ccbd266dc184ca1ead0c2.
  // ignore_for_file: camel_case_types, non_constant_identifier_names
