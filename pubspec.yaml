name: pocket_asr
description: "On-device speech recognition."
publish_to: 'none'
version: 1.0.17+18

environment:
  sdk: ^3.13.3

dependencies:
  characters: ^1.4.1
  crypto: ^3.0.6
  file_selector: ^1.0.3
  crispasr: 0.8.32
  crispembed: 0.16.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sherpa_onnx: 1.13.8
  # sqlite3 3.x provides native assets; the obsolete sqlite3_flutter_libs
  # plugin is intentionally not used because it is incompatible with AGP 9.
  sqlite3: ^3.6.0
  path_provider: ^2.1.6
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/model_allowlist.json
