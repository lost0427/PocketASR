name: pocket_asr
description: "On-device speech recognition."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  characters: ^1.4.1
  crispasr: 0.8.32
  crispembed: 0.16.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sherpa_onnx: 1.13.8
  # v2 keeps the plain DynamicLibrary loading that works under `flutter test`;
  # v3 needs Dart native-asset hooks the Flutter test runner does not build yet.
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/model_allowlist.json
