name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Honest build: no Windows native fetch is wired, so this release ships
      # UnavailableAsrEngine/DeterministicEmbedder stand-ins.
      - run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pocket-asr-windows-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-asr-windows-${{ github.ref_name }}
          path: pocket-asr-windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  # Android release is enabled now that the native fetch path is wired. The fetch
  # is the job's first real step and is fail-fast: if the pinned CrispASR
  # download or its SHA-256 check fails, the job aborts before `flutter build apk`
  # and no APK is uploaded. CrispEmbed is bundled by the crispembed plugin's own
  # `fetchCrispembedLibs` Gradle task during the build — the only confirmed
  # CrispEmbed mechanism; no other CrispEmbed version/asset is substituted.
  #
  # The APK bundles native ENGINE libraries only. Model files (see
  # assets/model_allowlist.json) are NOT downloaded or bundled by this workflow:
  # users must provide models at runtime. Do not present this artifact as a model
  # bundle or fabricate a model download.
  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Fetch pinned native Android libraries
        run: bash scripts/ci/fetch_native_android.sh --with-crispembed
      - name: Verify native libraries staged in jniLibs
        run: test -f android/app/src/main/jniLibs/arm64-v8a/libcrispasr.so && test -f android/app/src/main/jniLibs/arm64-v8a/libcrispembed.so
      - run: flutter build apk --release
      - name: Verify native libraries packaged in the APK
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q 'lib/arm64-v8a/libcrispasr.so' && unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q 'lib/arm64-v8a/libcrispembed.so'
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-asr-android-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-asr-*
          path: release-assets
          merge-multiple: true
      - name: Rename Android package
        run: mv release-assets/app-release.apk release-assets/pocket-asr-android-${{ github.ref_name }}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PocketASR ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
