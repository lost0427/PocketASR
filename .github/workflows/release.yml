name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore cached Windows native build
        id: windows-native-cache
        uses: actions/cache@v4
        with:
          path: native/windows
          key: native-windows-x64-${{ hashFiles('scripts/ci/build_native_windows.ps1') }}
      - name: Build CrispEmbed from pinned source
        if: steps.windows-native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/build_native_windows.ps1
      - run: flutter build windows --release
      - name: Verify bundled CrispEmbed
        shell: pwsh
        run: ./scripts/ci/verify_windows_native.ps1 -BundleDirectory build/windows/x64/runner/Release
      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/ci/stage_ffmpeg_windows.ps1 -Destination build/windows/x64/runner/Release
      - name: Test bundled audio decoder
        shell: pwsh
        run: |
          $env:POCKETASR_TEST_FFMPEG = "$PWD/build/windows/x64/runner/Release/ffmpeg/bin/ffmpeg.exe"
          flutter test test/ffmpeg_decoder_test.dart
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pocket-asr-windows-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-asr-windows-${{ github.ref_name }}
          path: pocket-asr-windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  # Android: restore the pinned native libraries from cache when possible;
  # otherwise rebuild them from source with NDK r28+ and 16KB LOAD alignment.
  # The APK is always checked for ELF alignment, DT_NEEDED closure and zipalign
  # before upload. If any check fails, this job fails and `publish` never runs.
  #
  # The APK bundles native ENGINE libraries only. Model files (see
  # assets/model_allowlist.json) are NOT downloaded or bundled by this workflow:
  # users must provide models at runtime. Do not present this artifact as a model
  # bundle or fabricate a model download.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: native-ccache-${{ hashFiles('scripts/ci/build_native_android.sh') }}
          restore-keys: |
            native-ccache-
      - name: Restore cached native build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: native-android-${{ hashFiles('scripts/ci/build_native_android.sh') }}
      - name: Check native libs
        id: native-check
        run: |
          if [ -f android/app/src/main/jniLibs/arm64-v8a/libcrispasr.so ] && [ -f android/app/src/main/jniLibs/arm64-v8a/libcrispembed.so ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build 16KB-aligned native libraries from pinned sources
        if: steps.native-check.outputs.found != 'true'
        run: bash scripts/ci/build_native_android.sh
      - run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK native payload
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          python3 scripts/ci/verify_apk_native.py "$APK" \
            --require libcrispasr.so --require libcrispembed.so \
            --require-symbol libcrispasr.so:whisper_full \
            --require-symbol libcrispembed.so:crispembed_init
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -c -P 16 4 "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-asr-android-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-asr-*
          path: release-assets
          merge-multiple: true
      - name: Rename Android package
        run: mv release-assets/app-release.apk release-assets/pocket-asr-android-${{ github.ref_name }}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PocketASR ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
