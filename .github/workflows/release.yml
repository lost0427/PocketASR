name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Candidate build {0}', github.run_number) ||
      github.event_name == 'schedule' && 'Warm Android native cache' ||
      github.ref == 'refs/heads/main' && 'Warm Android native cache' ||
      format('Release {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/ci/build_native_android.sh'
      - 'scripts/ci/build_native_sherpa_mnn.sh'
      - 'scripts/ci/verify_apk_native.py'
      - 'scripts/ci/verify_apk_contents.py'
      - 'native/sherpa_mnn/**'
      - 'native/decode/**'
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore cached Windows native build
        id: windows-native-cache
        uses: actions/cache@v4
        with:
          path: native/windows
          key: native-windows-x64-${{ hashFiles('scripts/ci/build_native_windows.ps1') }}
      - name: Build CrispEmbed from pinned source
        if: steps.windows-native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/build_native_windows.ps1
      - run: flutter build windows --release
      - name: Verify bundled CrispEmbed
        shell: pwsh
        run: ./scripts/ci/verify_windows_native.ps1 -BundleDirectory build/windows/x64/runner/Release
      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/ci/stage_ffmpeg_windows.ps1 -Destination build/windows/x64/runner/Release
      - name: Test bundled audio decoder
        shell: pwsh
        run: |
          $env:POCKETASR_TEST_FFMPEG = "$PWD/build/windows/x64/runner/Release/ffmpeg/bin/ffmpeg.exe"
          flutter test test/ffmpeg_decoder_test.dart
      - name: Package Windows release
        env:
          BUILD_LABEL: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_number) || github.ref_name }}
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "pocket-asr-windows-$env:BUILD_LABEL.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}-windows', github.run_number) || format('pocket-asr-windows-{0}', github.ref_name) }}
          path: pocket-asr-windows-${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_number) || github.ref_name }}.zip
          if-no-files-found: error

  # Android: two arm64 variants, built in parallel from the same source — the
  # i8mm APK (dotprod/fp16/i8mm kernels) and a -legacy APK for pre-i8mm devices.
  # Main-branch pushes touching native inputs and the weekly schedule warm the
  # per-variant native caches without packaging APKs. Tags and manual dispatches
  # build APKs. Each variant restores its own pinned libraries when possible;
  # otherwise it builds all four engines from pinned source with NDK r30 and 16KB LOAD
  # alignment. Both APKs are checked for ELF alignment, DT_NEEDED closure and
  # zipalign before upload, and the native build gates each variant's ISA
  # instructions in both directions (i8mm must have sdot/smmla, legacy must
  # not). If any check fails, that job fails and `publish` never runs.
  #
  # The APK bundles native ENGINE libraries and license notices only. Model files (see
  # assets/model_allowlist.json) are NOT downloaded or bundled by this workflow:
  # users must provide models at runtime. Do not present this artifact as a model
  # bundle or fabricate a model download.
  android:
    name: android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    env:
      BUILD_APK: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      # Keep both variants running: when the ARM ISA gate fires, the useful
      # signal is whether one payload is wrong or both are.
      fail-fast: false
      matrix:
        include:
          # Default APK, unsuffixed file name: ggml built with dotprod/fp16/i8mm
          # kernels. Needs an armv8.6-a SoC (~2021+); pre-i8mm devices fault.
          - variant: i8mm
            arch: armv8.6-a+dotprod+fp16+i8mm
            suffix: ""
          # -legacy APK: plain armv8-a baseline, installs on any arm64 device.
          # Runs the slow NEON Q8_0 path — that is the point, not a regression.
          - variant: legacy
            arch: ""
            suffix: -legacy
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: env.BUILD_APK == 'true'
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        if: env.BUILD_APK == 'true'
      - run: flutter pub get
        if: env.BUILD_APK == 'true'
      - name: Restore cached native build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a
            build/native-maps
          key: native-android-${{ matrix.variant }}-${{ matrix.arch }}-${{ hashFiles('scripts/ci/build_native_android.sh', 'scripts/ci/build_native_sherpa_mnn.sh', 'scripts/ci/verify_apk_native.py', 'scripts/ci/verify_apk_contents.py', 'native/sherpa_mnn/**/*', 'native/decode/**/*') }}
      - name: Check native libs
        id: native-check
        run: |
          LIBDIR=android/app/src/main/jniLibs/arm64-v8a
          LINK_MAP="build/native-maps/sherpa-mnn-${{ matrix.variant }}.map"
          if [ -f "$LIBDIR/libcrispasr.so" ] && \
             [ -f "$LIBDIR/libcrispembed.so" ] && \
             [ -f "$LIBDIR/libpocketasr_decode.so" ] && \
             [ -f "$LIBDIR/libsherpa-mnn-c-api.so" ] && \
             [ ! -f "$LIBDIR/libMNN.so" ] && \
             [ -f "$LINK_MAP" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore native compiler cache
        if: steps.native-check.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            .ccache-sherpa-mnn
          key: native-ccache-${{ matrix.variant }}-${{ matrix.arch }}-${{ hashFiles('scripts/ci/build_native_android.sh', 'scripts/ci/build_native_sherpa_mnn.sh') }}
          restore-keys: |
            native-ccache-${{ matrix.variant }}-${{ matrix.arch }}-
      - name: Install ccache
        if: steps.native-check.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
      - name: Build all 16KB-aligned native libraries from pinned sources
        if: steps.native-check.outputs.found != 'true'
        env:
          # Empty selects the armv8-a baseline (see build_native_android.sh).
          GGML_CPU_ARM_ARCH_ANDROID: ${{ matrix.arch }}
          SHERPA_MNN_LINK_MAP: ${{ github.workspace }}/build/native-maps/sherpa-mnn-${{ matrix.variant }}.map
          CCACHE_MAXSIZE: 1G
        run: |
          bash scripts/ci/build_native_android.sh
          bash scripts/ci/build_native_sherpa_mnn.sh
      - run: flutter build apk --release --target-platform android-arm64
        if: env.BUILD_APK == 'true'
      - name: Verify APK native payload
        if: env.BUILD_APK == 'true'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          python3 scripts/ci/verify_apk_native.py "$APK" \
            --require libcrispasr.so --require libcrispembed.so \
            --require libpocketasr_decode.so \
            --require-symbol libcrispasr.so:whisper_full \
            --require-symbol libcrispembed.so:crispembed_init \
            --require-symbol libpocketasr_decode.so:pocketasr_chain_begin \
            --require libsherpa-mnn-c-api.so \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnCreateOfflineRecognizer \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnDestroyOfflineRecognizer \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnCreateOfflineStream \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnDestroyOfflineStream \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnAcceptWaveformOffline \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnDecodeOfflineStream \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnGetOfflineStreamResult \
            --require-symbol libsherpa-mnn-c-api.so:SherpaMnnDestroyOfflineRecognizerResult
          python3 scripts/ci/verify_apk_contents.py "$APK"
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -c -P 16 4 "$APK"
      - name: Name the APK for this build
        if: env.BUILD_APK == 'true'
        env:
          BUILD_LABEL: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_number) || github.ref_name }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/pocket-asr-android-${BUILD_LABEL}${{ matrix.suffix }}.apk"
      - uses: actions/upload-artifact@v4
        if: env.BUILD_APK == 'true'
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}-android-{1}', github.run_number, matrix.variant) || format('pocket-asr-android-{0}{1}', github.ref_name, matrix.suffix) }}
          path: build/app/outputs/flutter-apk/pocket-asr-android-${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_number) || github.ref_name }}${{ matrix.suffix }}.apk
          if-no-files-found: error
      - name: Retain Sherpa-MNN linker map
        if: env.BUILD_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}-linkmap-android-{1}', github.run_number, matrix.variant) || format('native-link-map-{0}-android-{1}', github.ref_name, matrix.variant) }}
          path: build/native-maps/sherpa-mnn-${{ matrix.variant }}.map
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-asr-*
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: ls -l release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PocketASR ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Android: two arm64 APKs.

            - `pocket-asr-android-${{ github.ref_name }}.apk` — ggml built with
              dotprod/fp16/i8mm. Fastest. Needs an armv8.6-a SoC (~2021 or
              newer); older devices crash on load.
            - `pocket-asr-android-${{ github.ref_name }}-legacy.apk` — plain
              armv8-a build of the same code. Installs on any arm64 device;
              embedding runs on the slow NEON path.

            Not sure which SoC you have? Install the legacy APK.

            Both APKs include the Sherpa-MNN native engine and its license
            notices. The SenseVoice MNN model weights are not bundled; download
            the verified model from the in-app Model Library.
          files: release-assets/*
