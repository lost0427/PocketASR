name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --debug
      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/ci/stage_ffmpeg_windows.ps1 -Destination build/windows/x64/runner/Debug
      - name: Test bundled audio decoder
        shell: pwsh
        run: |
          $env:POCKETASR_TEST_FFMPEG = "$PWD/build/windows/x64/runner/Debug/ffmpeg/bin/ffmpeg.exe"
          flutter test test/ffmpeg_decoder_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: windows-debug
          path: build/windows/x64/runner/Debug
          if-no-files-found: error

  # Android (arm64-v8a). The native engine libraries are BUILT FROM SOURCE in
  # this job, not fetched: scripts/ci/build_native_android.sh compiles the
  # commit-pinned CrispASR/CrispEmbed trees (plus each repo's own pinned ggml,
  # statically embedded — the two ggml versions are never shared) with NDK
  # r28+ so every shipped .so is 16KB LOAD-aligned. The old prebuilt tarball
  # fetch was retired: its hashes were genuine but the bits were only 4KB
  # aligned (native/README.md). The job fails closed — ELF LOAD alignment,
  # DT_NEEDED closure and zipalign are verified against the built APK before
  # any artifact is uploaded.
  # Model files are NOT fetched or bundled. The APK ships engine libraries
  # only; users must supply models (see assets/model_allowlist.json) at runtime.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: native-ccache-${{ hashFiles('scripts/ci/build_native_android.sh') }}
          restore-keys: |
            native-ccache-
      - name: Restore cached native build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: native-android-${{ hashFiles('scripts/ci/build_native_android.sh') }}
      - name: Build 16KB-aligned native libraries from pinned sources
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/build_native_android.sh
      - run: flutter build apk --debug
      - name: Verify APK native payload
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          python3 scripts/ci/verify_apk_native.py "$APK" \
            --require libcrispasr.so --require libcrispembed.so \
            --require-symbol libcrispasr.so:whisper_full \
            --require-symbol libcrispembed.so:crispembed_init
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -c -P 16 4 "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
